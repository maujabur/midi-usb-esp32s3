; ESP32-S3 USB MIDI -> M-Vave FM1
;
; Perfis com a mesma logica (lib/core) e codigo de plataforma separado em src/.
; Detalhes de montagem no README.md.
;   s3zero_device: ESP32-S3 como DISPOSITIVO USB (TinyUSB). Ele aparece como um
;                  teclado MIDI e o outro lado (PC, etc.) e o host.
;   s3zero_host  : ESP32-S3 como HOST USB (usb_host do ESP-IDF). O FM1 e que e
;                  dispositivo, entao o S3 faz o papel do computador. Funciona
;                  direto ou atras de hub.
;   s3zero_router: roteador USB MIDI entre varios aparelhos num hub.
;   s3zero_harpa_vl53l1x / s3zero_harpa_vl53l0x: harpa laser com sensores de
;                  distancia. Host (FM1) ou device (teclado MIDI) escolhido no
;                  boot por uma ponte de solda. Config: lib/harpa/harpa_config.h.
;   serial_bridge: ferramenta de desenvolvimento. Segundo S3-Zero como
;                  adaptador USB-serial, para ler o log do s3zero_host.
;   native       : testes de logica pura no PC.
; Requer o core Arduino-ESP32 3.x (pioarduino) para a classe USBMIDI.

[env]
platform = espressif32
framework = arduino
lib_extra_dirs = lib

[esp32s3_zero]
board = waveshare_esp32_s3_zero
monitor_speed = 115200
; Brilho do LED de status, igual em todos os perfis (ver lib/core/status_led.h).
;   LED_LEVEL     : brilho maximo de cada canal, 0..255
;   LED_GREEN_PCT : fator do verde, 0..100 (o verde parece mais forte ao olho)
led_flags =
    -DLED_LEVEL=20
    -DLED_GREEN_PCT=40

; ---------------------------------------------------------------------------
; Perfil original: S3 como dispositivo USB MIDI (para PC, celular ou o roteador)
; ---------------------------------------------------------------------------
[env:s3zero_device]
extends = esp32s3_zero
build_src_filter = -<*> +<device/>
; A lib USB do core inclui FS.h; o modo deep+ resolve essa dependencia
lib_ldf_mode = deep+

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; USB nativo (TinyUSB) em vez do USB-Serial/JTAG padrao da placa
    -DARDUINO_USB_MODE=0
    ; 0 = so MIDI (mais compativel com o host do FM1); 1 = MIDI + CDC para logs
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ${esp32s3_zero.led_flags}
    ; a lib USB do core inclui FS.h (USBHostMSC) mas o LDF nao a encontra
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; ---------------------------------------------------------------------------
; S3 como host USB (FM1 na porta USB-C da placa, direto ou via hub)
; Serial (logs) sai pela UART0: TX=GPIO43, RX=GPIO44 (use o perfil serial_bridge).
; ---------------------------------------------------------------------------
[env:s3zero_host]
extends = esp32s3_zero
build_src_filter = -<*> +<host/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; a porta USB nativa e do host: nada de CDC no USB (Serial vai pra UART0)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ${esp32s3_zero.led_flags}
    ; 1 = logs detalhados (porta USB, registradores, sinal de vida a cada 5 s)
    -DUSB_HOST_DIAG=0

; ---------------------------------------------------------------------------
; Roteador USB MIDI: varios aparelhos num hub (FM1, teclado, pads, knobs).
; O que um aparelho envia, os outros recebem. Regras em lib/core/midi_router.h.
; ---------------------------------------------------------------------------
[env:s3zero_router]
extends = esp32s3_zero
build_src_filter = -<*> +<router/> +<common/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -Isrc/common
    ; a porta USB nativa e do host: nada de CDC no USB (Serial vai pra UART0)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ${esp32s3_zero.led_flags}
    ; 1..16 = forca o canal de tudo que passa (1 = padrao do FM1); 0 = mantem
    -DROUTER_FORCE_CHANNEL=1
    ; 1 = loga cada pacote roteado (origem -> mascara de destinos: bytes)
    -DUSB_HOST_DIAG=0

; ---------------------------------------------------------------------------
; Harpa laser: 10 sensores de distancia (uma corda cada). Um perfil por tipo
; de sensor, o mesmo binario serve de host ou de device: no boot, uma ponte de
; solda entre os pads GPIO42 e GPIO45 escolhe (sem ponte = host, toca no FM1;
; com ponte = device, aparece como teclado MIDI "Harpa MIDI").
; Pinos, enderecos, trigger/release e escala: lib/harpa/harpa_config.h.
; Serial (logs) sai pela UART0 (GPIO43/44), como no s3zero_host.
; ---------------------------------------------------------------------------
[s3zero_harpa]
extends = esp32s3_zero
build_src_filter = -<*> +<harpa/> +<host/usb_host_midi.cpp>
; A lib USB do core inclui FS.h; o modo deep+ resolve essa dependencia
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -Isrc/host
    -Isrc/device
    -Isrc/role
    ; TinyUSB presente, mas so iniciado no modo device (nada sobe no boot)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ${esp32s3_zero.led_flags}
    ; 1 = linha DIST (distancia e estado do cache de cada corda) a cada 100 ms
    -DHARPA_TELEMETRY=0
    -DUSB_HOST_DIAG=0
    ; a lib USB do core inclui FS.h (USBHostMSC) mas o LDF nao a encontra
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

[env:s3zero_harpa_vl53l1x]
extends = s3zero_harpa
lib_deps =
    pololu/VL53L1X @ ^1.3.1
build_flags =
    ${s3zero_harpa.build_flags}
    -DHARPA_SENSOR_VL53L1X

[env:s3zero_harpa_vl53l0x]
extends = s3zero_harpa
lib_deps =
    pololu/VL53L0X @ ^1.3.1
build_flags =
    ${s3zero_harpa.build_flags}
    -DHARPA_SENSOR_VL53L0X

; ---------------------------------------------------------------------------
; Teste: host OU device escolhido no boot, num unico binario. Le uma ponte de
; solda entre os pinos vizinhos MODE_PIN_OUT e MODE_PIN_IN (padrao GPIO5 e 6):
; sem ponte = host (FM1), com ponte = device (teclado MIDI). O BOOT toca a
; sequencia de teste nos dois modos. Detalhes em src/modetest/main.cpp.
; ---------------------------------------------------------------------------
[env:s3zero_modetest]
extends = esp32s3_zero
build_src_filter = -<*> +<modetest/> +<host/usb_host_midi.cpp>
; A lib USB do core inclui FS.h; o modo deep+ resolve essa dependencia
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -Isrc/host
    -Isrc/device
    -Isrc/role
    ; TinyUSB presente, mas so iniciado no modo device (nada sobe no boot)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ${esp32s3_zero.led_flags}
    -DMODE_PIN_OUT=5
    -DMODE_PIN_IN=6
    -DUSB_HOST_DIAG=0
    ; a lib USB do core inclui FS.h (USBHostMSC) mas o LDF nao a encontra
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; ---------------------------------------------------------------------------
; Ferramenta de desenvolvimento (nao faz parte do produto): ponte serial.
; Um segundo S3-Zero vira adaptador USB-serial para ler o log do s3zero_host.
; Ligacao: ponte 43(TX)->alvo 44(RX), ponte 44(RX)<-alvo 43(TX), GND.
; Usa o USB-Serial/JTAG padrao da placa (CDC no boot), sem flags extras.
;   pio run -e serial_bridge -t upload && pio device monitor -e serial_bridge
; ---------------------------------------------------------------------------
[env:serial_bridge]
extends = esp32s3_zero
build_src_filter = -<*> +<serial_bridge/>
build_flags =
    ${esp32s3_zero.led_flags}

; Testes de logica pura no PC (sem hardware): pio test -e native -e native_l0x
; Cada ambiente compila a config da harpa para um tipo de sensor.
[env:native]
platform = native
framework =
lib_extra_dirs = lib
test_framework = unity
build_flags =
    -std=gnu++17
    -DHARPA_SENSOR_VL53L1X

[env:native_l0x]
extends = env:native
build_flags =
    -std=gnu++17
    -DHARPA_SENSOR_VL53L0X
