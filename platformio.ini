; ESP32-S3 USB MIDI -> M-Vave FM1
;
; Perfis com a mesma logica (lib/core) e codigo de plataforma separado em src/.
; Detalhes de montagem no README.md.
;   s3zero       : ESP32-S3 como DISPOSITIVO USB (TinyUSB). Ele aparece como um
;                  teclado MIDI e o outro lado (PC, etc.) e o host.
;   s3zero_host  : ESP32-S3 como HOST USB (usb_host do ESP-IDF). O FM1 e que e
;                  dispositivo, entao o S3 faz o papel do computador. Funciona
;                  direto ou atras de hub.
;   s3zero_router: roteador USB MIDI entre varios aparelhos num hub.
;   serial_bridge: ferramenta de desenvolvimento. Segundo S3-Zero como
;                  adaptador USB-serial, para ler o log do s3zero_host.
;   native       : testes de logica pura no PC.
; Requer o core Arduino-ESP32 3.x (pioarduino) para a classe USBMIDI.

[env]
platform = espressif32
framework = arduino
lib_extra_dirs = lib

[esp32s3_zero]
board = waveshare_esp32_s3_zero
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Perfil original: S3 como dispositivo USB MIDI
; ---------------------------------------------------------------------------
[env:s3zero]
extends = esp32s3_zero
build_src_filter = -<*> +<device/>
; A lib USB do core inclui FS.h; o modo deep+ resolve essa dependencia
lib_ldf_mode = deep+

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; USB nativo (TinyUSB) em vez do USB-Serial/JTAG padrao da placa
    -DARDUINO_USB_MODE=0
    ; 0 = so MIDI (mais compativel com o host do FM1); 1 = MIDI + CDC para logs
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ; a lib USB do core inclui FS.h (USBHostMSC) mas o LDF nao a encontra
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; ---------------------------------------------------------------------------
; S3 como host USB (FM1 na porta USB-C da placa, direto ou via hub)
; Serial (logs) sai pela UART0: TX=GPIO43, RX=GPIO44 (use o perfil serial_bridge).
; ---------------------------------------------------------------------------
[env:s3zero_host]
extends = esp32s3_zero
build_src_filter = -<*> +<host/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; a porta USB nativa e do host: nada de CDC no USB (Serial vai pra UART0)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ; 1 = logs detalhados (porta USB, registradores, sinal de vida a cada 5 s)
    -DUSB_HOST_DIAG=0

; ---------------------------------------------------------------------------
; Roteador USB MIDI: varios aparelhos num hub (FM1, teclado, pads, knobs).
; O que um aparelho envia, os outros recebem. Regras em lib/core/midi_router.h.
; ---------------------------------------------------------------------------
[env:s3zero_router]
extends = esp32s3_zero
build_src_filter = -<*> +<router/> +<common/>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -Isrc/common
    ; a porta USB nativa e do host: nada de CDC no USB (Serial vai pra UART0)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOOT_BUTTON_PIN=0
    ; 1..16 = forca o canal de tudo que passa (1 = padrao do FM1); 0 = mantem
    -DROUTER_FORCE_CHANNEL=1
    ; 1 = loga cada pacote roteado (origem -> mascara de destinos: bytes)
    -DUSB_HOST_DIAG=0

; ---------------------------------------------------------------------------
; Ferramenta de desenvolvimento (nao faz parte do produto): ponte serial.
; Um segundo S3-Zero vira adaptador USB-serial para ler o log do s3zero_host.
; Ligacao: ponte 43(TX)->alvo 44(RX), ponte 44(RX)<-alvo 43(TX), GND.
; Usa o USB-Serial/JTAG padrao da placa (CDC no boot), sem flags extras.
;   pio run -e serial_bridge -t upload && pio device monitor -e serial_bridge
; ---------------------------------------------------------------------------
[env:serial_bridge]
extends = esp32s3_zero
build_src_filter = -<*> +<serial_bridge/>

; Testes de logica pura no PC (sem hardware): pio test -e native
[env:native]
platform = native
framework =
lib_extra_dirs = lib
test_framework = unity
build_flags = -std=gnu++17
